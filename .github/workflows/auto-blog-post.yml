name: Auto Blog Post

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-blog-post
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate source blog post
        run: npm run blog:auto-post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RAKKO_KEYWORD_API_KEY: ${{ secrets.RAKKO_KEYWORD_API_KEY }}

      - name: Verify build
        run: npm run build

      - name: Commit generated article
        run: |
          if git diff --quiet -- src/data/blog-articles.ts public/blog; then
            echo "No blog changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/blog-articles.ts public/blog
          git commit -m "feat: auto-generate blog article"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push was rejected. Retrying after fetching latest main... ($attempt/3)"
            sleep 5
          done
          echo "Failed to push generated article after 3 attempts."
          exit 1
