<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Home gym favicon</title>
  <desc id="desc">Square favicon with a white background and an orange house outline containing a dark dumbbell.</desc>
  <defs>
    <linearGradient id="orange" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#ff431f"/>
      <stop offset="50%" stop-color="#fe4b23"/>
      <stop offset="100%" stop-color="#fe4d25"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#303945"/>
      <stop offset="55%" stop-color="#242d34"/>
      <stop offset="100%" stop-color="#20272d"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="512" height="512" fill="#ffffff"/>

  <!-- Scaled from the original 375x303 artwork and centered in a square canvas -->
  <g transform="translate(40,82) scale(1.152)">
    <!-- roof and upper house outline -->
    <path fill="url(#orange)" stroke="#FF3B18" stroke-width="1" stroke-linejoin="round" d="
      M 36 115
      C 36 109, 39 105, 43 103
      L 181 9
      C 187 6, 190 6, 195 6
      C 198 6, 202 8, 204 10
      L 340 102
      C 345 106, 348 112, 348 118
      L 348 161
      L 337 162
      C 331 162, 327 158, 325 152
      L 325 121
      L 193 30
      L 183 35
      L 59 121
      L 59 152
      C 59 157, 55 161, 51 161
      L 36 161
      Z"/>

    <!-- lower house outline -->
    <path fill="url(#orange)" stroke="#FF3B18" stroke-width="1" stroke-linejoin="round" d="
      M 36 184
      C 36 176, 41 171, 48 171
      L 67 170
      L 67 192
      L 59 193
      L 60 266
      L 324 266
      L 325 193
      L 316 192
      L 316 170
      L 334 170
      C 342 170, 348 177, 348 184
      L 348 274
      C 348 282, 343 286, 335 288
      L 49 288
      C 41 288, 36 280, 36 275
      Z"/>

    <!-- center bar -->
    <path fill="url(#orange)" stroke="#FF3B18" stroke-width="0.8" d="M 143 170 L 239 170 L 240 192 L 143 193 Z"/>

    <!-- dumbbell plates -->
    <g fill="url(#dark)" stroke="#111923" stroke-width="1.4">
      <rect x="74.5" y="139.5" width="25" height="84" rx="5.2" ry="5.2"/>
      <rect x="106.5" y="122.5" width="28.5" height="123.5" rx="5.3" ry="5.3"/>
      <rect x="249.5" y="122.5" width="28.5" height="123.5" rx="5.3" ry="5.3"/>
      <rect x="284.5" y="139.5" width="25" height="84" rx="5.2" ry="5.2"/>
    </g>
  </g>
</svg>
